name: mailport-direct-mx

services:
  worker:
    container_name: mailport-direct-mx
    image: ${MAILPORT_DIRECT_MX_IMAGE:-mailport-direct-mx:0.1.0}
    platform: linux/amd64
    env_file: ${MAILPORT_ENV_FILE:-/opt/mailport/secrets/mailport.env}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /opt/mailport/data:/data
    ports:
      - "127.0.0.1:8799:8799"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8799/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
