# fly.toml app configuration file generated for mailerport on 2026-09-10T17:10:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mailerport'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  MAILPORT_OPERATIONS = '/data/operations.json'
  MAILPORT_OUTBOX = '/data/outbox.json'
  MAILPORT_SMTP_REQUIRE_TLS = 'true'
  MAILPORT_TRANSPORT = 'smtp'
  NODE_ENV = 'production'
  PORT = '8789'

[[mounts]]
  source = 'mailport_data'
  destination = '/data'

[http_service]
  internal_port = 8789
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
