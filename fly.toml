app = "replace-with-your-mailport-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8789"
  MAILPORT_TRANSPORT = "smtp"
  MAILPORT_OUTBOX = "/data/outbox.json"
  MAILPORT_OPERATIONS = "/data/operations.json"
  MAILPORT_SMTP_REQUIRE_TLS = "true"

[http_service]
  internal_port = 8789
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"

[[mounts]]
  source = "mailport_data"
  destination = "/data"
